<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hoja de ruta · Lima Mecanizados</title>
  <link rel="stylesheet" href="css/estilos.css">
  <style>
    html, body { background: #e9edf2; color-scheme: light; }
    .pagina { max-width: 640px; margin: 0 auto; padding: 24px 16px 40px; }
    .pagina .barra { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .pagina .barra p { color: #4a5868; font-size: 14px; }
    .pagina .hoja { max-width: none; box-shadow: 0 2px 12px rgba(0, 0, 0, .12); padding: 30px 32px; }
    .pagina .boton { background: #1d5fa8; border-color: #1d5fa8; color: #fff; }
    .pagina .sin-conexion { background: #fce8e5; border-color: #c2372b; color: #15202d; }
    .pagina .sin-conexion h2 { color: #c2372b; }
    .pagina .cargando { color: #4a5868; }
    @page { size: A4 portrait; margin: 12mm; }
    @media print {
      html, body { background: #fff; }
      .pagina { padding: 0; max-width: none; }
      .pagina .barra { display: none; }
      /* Tamaño real (como en pantalla), no estirada a toda la hoja; el borde punteado sirve para recortarla. */
      .pagina .hoja { width: 148mm; max-width: none; border: 1px dashed #888; border-radius: 0; box-shadow: none; padding: 7mm 8mm; }
    }
  </style>
</head>
<body>
  <main class="pagina">
    <div class="barra">
      <p>Hoja de ruta lista para imprimir (sale chica en una hoja A4; se recorta por la línea punteada).</p>
      <button class="boton" type="button" id="imprimir">Imprimir</button>
    </div>
    <div id="hoja"><p class="cargando">Cargando…</p></div>
  </main>
  <script type="module" src="js/hoja.js"></script>
</body>
</html>
